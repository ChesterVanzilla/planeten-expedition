<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Planeten Expedition – Quiz</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <section class="screen active game-screen">
      <div class="game-controls">
        <button class="control-btn" onclick="location.href='index.html'">Zurück</button>
        <button id="resetBtn" class="control-btn">Neustart</button>
      </div>

    <div id="quizLevelSelect" class="quiz-level-select panel">
  <h2 class="quiz-level-title">Wähle ein Quiz-Level</h2>
  <p class="quiz-level-subtitle">Entscheide, wie du die Planeten und ihre Fakten entdecken möchtest.</p>

  <div class="quiz-level-grid">
    <button id="quizLevel1Btn" class="quiz-level-card" type="button">
      <div class="quiz-level-card-title">Level 1</div>
      <div class="quiz-level-card-text">Lies einen Hinweis und wähle den passenden Planeten aus.</div>
    </button>

    <button id="quizLevel2Btn" class="quiz-level-card" type="button">
      <div class="quiz-level-card-title">Level 2</div>
      <div class="quiz-level-card-text">Sieh dir einen Planeten an und finde den passenden Fakt dazu.</div>
    </button>
  </div>
</div>

<div id="quizGameArea" style="display:none;">
<div id="quizStatusBar" class="quiz-status-bar panel">
  <div class="quiz-status-top">
    <div id="quizMissionTitle" class="quiz-mission-title">Mission 1: Finde den Planeten</div>
    <div id="quizProgressText" class="quiz-progress-text">Frage 1 von 8</div>
  </div>

  <div class="quiz-progress-row">
    <div class="quiz-progress-track">
      <div id="quizProgressFill" class="quiz-progress-fill"></div>
    </div>
    <div id="quizStarsText" class="quiz-stars-text">⭐ 0 / 8</div>
  </div>
</div>

  <div id="quizQuestionWrap" class="quiz-question-box panel">
    <div id="quizQuestionLabel" class="quiz-question-label">Welcher Planet ist gemeint?</div>
    <div id="quizQuestionText" class="quiz-question-text"></div>
  </div>

  <div id="quizPlanetPrompt" class="quiz-planet-prompt panel" style="display:none;">
    <div class="quiz-planet-prompt-inner">
      <img id="quizPlanetPromptImage" class="quiz-planet-prompt-image" src="" alt="" />
      <div id="quizPlanetPromptName" class="quiz-planet-prompt-name"></div>
    </div>
  </div>

  <div id="quizFeedback" class="quiz-feedback"></div>

  <div class="quiz-answer-wrap">
    <div id="quizAnswerGrid" class="quiz-answer-grid"></div>
  </div>
</div>

      <div class="info-panel-wrap">
        <div class="info-panel panel">
          <div id="infoTitle" class="info-title"></div>
          <div id="infoText" class="info-text"></div>
        </div>
      </div>
    </section>

    <div id="endOverlay" class="end-overlay">
      <div class="end-box panel">
        <h2>Geschafft!</h2>
        <p id="endText"></p>

        <div class="end-actions">
          <button id="restartBtn" class="main-btn">Nochmal spielen</button>
          <button class="main-btn" onclick="location.href='index.html'">Zur Modus-Auswahl</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/planet-data.js"></script>
  <script src="js/game-common.js"></script>
  <script>
    initGame("quiz");
  </script>
</body>
</html>
